[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "origen-research"
version = "0.3.0"
description = "Auditable research-frame generation, prequential evaluation and adversarial controls"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
origen = "origen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
