name: ORIGEN V322 hierarchical partition and divide
on:
  push:
    paths:
      - "research/ORIGEN_v0_3/src/origen/v322_hierarchical_partition.py"
      - "research/ORIGEN_v0_3/tests/test_v322_hierarchical_partition.py"
      - "research/ORIGEN_v0_3/PREREGISTRATION_V322_HIERARCHICAL_PARTITION.md"
      - "data/history/Chispazo_through_12249.csv"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v322:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numerical runtime
        run: python -m pip install numpy
      - name: Run V322 unit tests
        env:
          PYTHONPATH: research/ORIGEN_v0_3/src
        run: python -m unittest research/ORIGEN_v0_3/tests/test_v322_hierarchical_partition.py -v
      - name: Run full chronological V322 replay
        env:
          PYTHONPATH: research/ORIGEN_v0_3/src
        run: >-
          python -m origen.v322_hierarchical_partition
          --history data/history/Chispazo_through_12249.csv
          --out /tmp/exact5-v322
          --expected-sha256 5a977558c57b6579258d4d6991d3d33fe97e742bc25f59e194ebc8b71928218a
      - name: Upload V322 report and per-draw scores
        uses: actions/upload-artifact@v4
        with:
          name: exact5-v322-hierarchical-partition
          path: |
            /tmp/exact5-v322/v322_hierarchical_partition_report.json
            /tmp/exact5-v322/v322_hierarchical_partition_scores.csv
          if-no-files-found: error
