name: V313 global null falsification
on:
  push:
    branches:
      - research/origen-v0.3-engine-20261118
    paths:
      - "research/ORIGEN_v0_3/src/origen/v313_global_null.py"
      - "research/ORIGEN_v0_3/src/origen/exact5_modalities.py"
      - "research/ORIGEN_v0_3/tests/test_v313_global_null.py"
      - "research/ORIGEN_v0_3/tests/test_reverse_engineering_oracles.py"
      - "data/history/Chispazo_through_12249.csv"
      - ".github/workflows/v313-global-null.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numerical runtime
        run: python -m pip install numpy
      - name: Run isolated ORIGEN tests
        working-directory: research/ORIGEN_v0_3
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run V313 preregistered global falsification
        env:
          PYTHONPATH: research/ORIGEN_v0_3/src
        run: python -m origen.v313_global_null --history data/history/Chispazo_through_12249.csv --out /tmp/exact5-v313 --simulations 1999 --seed 3132026
      - name: Upload V313 report
        uses: actions/upload-artifact@v4
        with:
          name: exact5-v313-global-null-falsification
          path: /tmp/exact5-v313/
          if-no-files-found: error
