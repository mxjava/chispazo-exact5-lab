name: V314 triple motif reverse engineering
on:
  push:
    branches:
      - research/origen-v0.3-engine-20261118
    paths:
      - "research/ORIGEN_v0_3/**"
      - ".github/workflows/v314-triple-motif.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numerical runtime
        run: python -m pip install numpy
      - name: Run isolated ORIGEN tests
        working-directory: research/ORIGEN_v0_3
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run V314 preregistered triple motif test
        env:
          PYTHONPATH: research/ORIGEN_v0_3/src
        run: python -m origen.v314_triple_motif --history data/history/Chispazo_through_12249.csv --out /tmp/exact5-v314 --simulations 1999 --seed 3142026
      - name: Upload V314 report
        uses: actions/upload-artifact@v4
        with:
          name: exact5-v314-triple-motif
          path: /tmp/exact5-v314/
          if-no-files-found: error
