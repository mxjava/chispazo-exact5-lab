name: ORIGEN v0.3 isolated validation
on:
  push:
    paths:
      - "research/ORIGEN_v0_3/src/**"
      - "research/ORIGEN_v0_3/tests/**"
      - "research/ORIGEN_v0_3/pyproject.toml"
      - "data/history/Chispazo_through_12249.csv"
      - ".github/workflows/origen-v03.yml"
  pull_request:
    paths:
      - "research/ORIGEN_v0_3/src/**"
      - "research/ORIGEN_v0_3/tests/**"
      - "research/ORIGEN_v0_3/pyproject.toml"
      - "data/history/Chispazo_through_12249.csv"
      - ".github/workflows/origen-v03.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numerical runtime for Exact5 diagnostics
        run: python -m pip install numpy
      - name: Run ORIGEN isolated tests
        working-directory: research/ORIGEN_v0_3
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run canonical Classic-only modality audit
        working-directory: .
        env:
          PYTHONPATH: research/ORIGEN_v0_3/src
        run: python -m origen.exact5_modalities --history data/history/Chispazo_through_12249.csv --out /tmp/exact5-modalities
      - name: Run frozen V312 retrospective integrity replay
        working-directory: .
        env:
          PYTHONPATH: research/ORIGEN_v0_3/src
        run: python -m origen.v312_static_mixture --history data/history/Chispazo_through_12249.csv --out /tmp/exact5-v312 --warmup 800 --code-commit "$GITHUB_SHA"
      - name: Run preregistered V313 global null falsification
        working-directory: .
        env:
          PYTHONPATH: research/ORIGEN_v0_3/src
        run: python -m origen.v313_global_null --history data/history/Chispazo_through_12249.csv --out /tmp/exact5-v313 --simulations 1999 --seed 3132026
      - name: Upload V313 global null report
        uses: actions/upload-artifact@v4
        with:
          name: exact5-v313-global-null-falsification
          path: /tmp/exact5-v313/
          if-no-files-found: error
      - name: Upload reproducible modality audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: exact5-classic-modality-audit
          path: /tmp/exact5-modalities/
          if-no-files-found: error
      - name: Upload V312 retrospective integrity outputs
        uses: actions/upload-artifact@v4
        with:
          name: exact5-v312-retrospective-integrity
          path: /tmp/exact5-v312/
          if-no-files-found: error
