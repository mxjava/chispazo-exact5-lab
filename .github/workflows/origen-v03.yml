name: ORIGEN v0.3 isolated validation
on:
  push:
    paths:
      - "research/ORIGEN_v0_3/src/**"
      - "research/ORIGEN_v0_3/tests/**"
      - "research/ORIGEN_v0_3/pyproject.toml"
      - "data/history/Chispazo_through_12249.csv"
      - ".github/workflows/origen-v03.yml"
  pull_request:
    paths:
      - "research/ORIGEN_v0_3/src/**"
      - "research/ORIGEN_v0_3/tests/**"
      - "research/ORIGEN_v0_3/pyproject.toml"
      - "data/history/Chispazo_through_12249.csv"
      - ".github/workflows/origen-v03.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numerical runtime for Exact5 diagnostics
        run: python -m pip install numpy
      - name: Install ORIGEN cryptographic runtime
        run: python -m pip install "cryptography>=42.0.0,<47.0.0" "asn1crypto>=1.5.1,<2.0.0"
      - name: Run ORIGEN isolated tests
        working-directory: research/ORIGEN_v0_3
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
