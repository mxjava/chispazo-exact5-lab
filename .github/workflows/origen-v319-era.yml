name: ORIGEN V319 fixed-era contrast
on:
  push:
    paths:
      - "research/ORIGEN_v0_3/src/origen/v319_fixed_era_contrast.py"
      - "research/ORIGEN_v0_3/tests/test_v319_fixed_era_contrast.py"
      - "research/ORIGEN_v0_3/PREREGISTRATION_V319_FIXED_ERA_CONTRAST.md"
      - "data/history/Chispazo_through_12249.csv"
      - ".github/workflows/origen-v319-era.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v319:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numerical runtime
        run: python -m pip install numpy
      - name: Run ORIGEN unit tests
        env:
          PYTHONPATH: research/ORIGEN_v0_3/src
        run: python -m unittest discover -s research/ORIGEN_v0_3/tests -p "test_*.py" -v
      - name: Run frozen V319 canonical replay
        env:
          PYTHONPATH: research/ORIGEN_v0_3/src
        run: python -m origen.v319_fixed_era_contrast --history data/history/Chispazo_through_12249.csv --out /tmp/exact5-v319
      - name: Upload V319 report
        uses: actions/upload-artifact@v4
        with:
          name: exact5-v319-fixed-era-contrast
          path: /tmp/exact5-v319/v319_fixed_era_contrast_report.json
          if-no-files-found: error
