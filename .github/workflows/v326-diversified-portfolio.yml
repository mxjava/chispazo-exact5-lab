name: v326 diversified portfolio audit
on:
  push:
    branches:
      - fix/origen-v03-integrity-guards-20261120
  workflow_dispatch:
jobs:
  diversified-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: src:research/ORIGEN_v0_3/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Verify immutable canonical history
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path("data/history/Chispazo_through_12249.csv")
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          expected = "5a977558c57b6579258d4d6991d3d33fe97e742bc25f59e194ebc8b71928218a"
          assert digest == expected, (digest, expected)
          print("canonical SHA256 PASS:", digest)
          PY
      - name: Generate diversified top-30 portfolios
        run: |
          python -m origen.v326_diverse_portfolio --history data/history/Chispazo_through_12249.csv --out artifacts/v326 --mode expanding --expected-sha256 5a977558c57b6579258d4d6991d3d33fe97e742bc25f59e194ebc8b71928218a
          for window in 400 800 1600; do
            python -m origen.v326_diverse_portfolio --history data/history/Chispazo_through_12249.csv --out artifacts/v326 --mode rolling --window-classic "$window" --expected-sha256 5a977558c57b6579258d4d6991d3d33fe97e742bc25f59e194ebc8b71928218a
          done
      - uses: actions/upload-artifact@v4
        with:
          name: exact5-v326-diversified-top30-audit
          path: artifacts/v326/
          if-no-files-found: error
