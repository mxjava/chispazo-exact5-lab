name: V316 identity-resolved temporal persistence
on:
  push:
    branches:
      - research/origen-v0.3-engine-20261118
    paths:
      - "research/ORIGEN_v0_3/**"
      - ".github/workflows/v316-identity-persistence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v316:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numerical runtime
        run: python -m pip install numpy
      - name: Run isolated ORIGEN tests
        working-directory: research/ORIGEN_v0_3
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run frozen V316 identity persistence omnibus
        env:
          PYTHONPATH: research/ORIGEN_v0_3/src
        run: python -m origen.v316_identity_persistence --history data/history/Chispazo_through_12249.csv --out /tmp/exact5-v316 --simulations 1999 --seed 3162026
      - name: Upload V316 report
        uses: actions/upload-artifact@v4
        with:
          name: exact5-v316-identity-temporal-persistence
          path: /tmp/exact5-v316/
          if-no-files-found: error
