name: V315 pair-conditioned transition falsification
on:
  push:
    branches:
      - research/origen-v0.3-engine-20261118
    paths:
      - "research/ORIGEN_v0_3/**"
      - ".github/workflows/v315-pair-transition.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v315:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numerical runtime
        run: python -m pip install numpy
      - name: Run isolated ORIGEN tests
        working-directory: research/ORIGEN_v0_3
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run V315 preregistered pair-conditioned transition test
        env:
          PYTHONPATH: research/ORIGEN_v0_3/src
        run: python -m origen.v315_pair_transition --history data/history/Chispazo_through_12249.csv --out /tmp/exact5-v315 --simulations 1999 --seed 3152026
      - name: Upload V315 report
        uses: actions/upload-artifact@v4
        with:
          name: exact5-v315-pair-transition
          path: /tmp/exact5-v315/
          if-no-files-found: error
